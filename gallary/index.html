<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .showimg {
            margin: 0 auto 30px;
            width: 100%;
            max-width: 320px;
            height: 420px;
            padding: 10px;
            border: 2px solid #1d4ed8;
            border-radius: 10px;
            background: #eff4ff;
        }

        .showimg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .gallary {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px;
            border: 2px solid #1d4ed8;
            border-radius: 10px;
            background: #eff4ff;
        }

        .gallary img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 3px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .gallary img:hover {
            transform: scale(1.06);
            border-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="showimg">
        <img src="../images/img1.jpg" alt="">
    </div>
    <div class="gallary">
        <img src="../images/img1.jpg" alt="">
        <img src="../images/img2.jpg" alt="">
    </div>
    <script>
        let gallary = document.querySelector(".gallary");
        gallary.addEventListener("click", (event) => {
            console.log(event.target.src)//select the child element
            console.log(event.currentTarget);//select the parent element
            if (event.target.src) {
                document.querySelector(".showimg img").src = event.target.src
            }
        })
    </script>
</body>

</html>
