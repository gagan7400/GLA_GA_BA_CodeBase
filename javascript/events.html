<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #canvas{
            height: 300px;
            background: grey;;
        }
    </style>
</head>

<body>
    <p id="myButton"> hello World</p>
    <div id="parent-container" style="padding: 20px; background-color: lightgray;">
        <button id="btn-1">Button 1</button>
        <button id="btn-2">Button 2</button>
    </div>
    <ul id="list">
        <li><button>Buy</button></li>
    </ul>
    <div id="box" style="padding:40px; background:#cde;">
        Parent
        <button id="child">Child</button>
    </div>
    <pre id="log"></pre>
    <div id="canvas">

    </div>
<div id="pad" style="height:150px; background:#eef;">Click here</div>
<pre id="out"></pre>
    <script>
        const pad = document.getElementById("pad");
const out = document.getElementById("out");

pad.addEventListener("mousedown", (e) => {
  const names = ["left", "middle", "right"];
  out.textContent =
    `button: ${e.button} (${names[e.button]})\n` +
    `buttons: ${e.buttons}\n` +
    `ctrl: ${e.ctrlKey}, shift: ${e.shiftKey}, ` +
    `alt: ${e.altKey}, meta: ${e.metaKey}`;
});

pad.addEventListener("contextmenu", (e) => e.preventDefault());
        const area = document.getElementById("canvas");

area.addEventListener("mousemove", (e) => {
  if (e.buttons & 1) {
    console.log("Dragging with left button at", e.clientX, e.clientY);
  }
  if (e.buttons & 2) {
    console.log("Right button is held");
  }
  if ((e.buttons & 1) && (e.buttons & 2)) {
    console.log("Both held");
  }
});
// document.addEventListener("mousedown", (e) => {
//   if (e.button === 0) console.log("Left click");
//   if (e.button === 1) console.log("Middle click (wheel)");
//   if (e.button === 2) console.log("Right click");
// });
        const box = document.getElementById("box");
        const log = document.getElementById("log");

        function write(e) {
            log.textContent += `${e.type} -> target: ${e.target.id || "box"}\n`;
        }

        box.addEventListener("mouseenter", write);
        box.addEventListener("mouseleave", write);
        box.addEventListener("mouseover", write);
        box.addEventListener("mouseout", write);


        document.getElementById("list").addEventListener("click", (e) => {
            console.log(e.target);        // <button> (what was clicked)
            console.log(e.currentTarget); // <ul> (where the listener lives)
            console.log(e.type);          // "click"
            console.log(e.isTrusted);     // true if a person clicked
            console.log(e.timeStamp);     // true if a person clicked
        });
        const parent = document.querySelector("#parent-container");
        const button1 = document.querySelector("#btn-1");

        // Listener on the Button (The Target)
        button1.addEventListener("click", () => {
            console.log("1. Button 1 clicked!");
        });

        // Listener on the Parent Div (The Ancestor)
        parent.addEventListener("click", () => {
            console.log("2. Parent DIV clicked!");
        }, { capture: false });

        // 1. Select the button from the DOM
        const btn = document.querySelector("#myButton");

        // 2. Define the callback function
        function onClick(event) {
            console.log("Button clicked!");

            // Since 'passive: true' is set, this line will either be 
            // ignored or throw a console warning in the browser:
            event.preventDefault();
        }

        // 3. Attach the listener with options
        btn.addEventListener("click", onClick, {
            once: true,
            passive: false,
            capture: false
        });
        //• If capture: false (Default): Clicking the button fires the Button listener first, then the Div listener (Bubbling up).
        //• If capture: true: Clicking the button fires the Div listener first, then the Button listener (Capturing down).         
    </script>

</body>

</html>
<!-- Event delegation :Instead of attaching an individual event listener to every single child element (e.g., 50 different list items <li>), you attach a single event listener to a common parent element (e.g., the <ul> or a <div>) -->
<!-- Better Performance: Uses fewer memory resources and less code setup by having one listener instead of hundreds. -->
