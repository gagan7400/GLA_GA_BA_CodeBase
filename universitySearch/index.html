<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .searchbox {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 20px;
        }

        .searchbox input {
            padding: 5px 10px;
            width: 300px;
            font-size: 24px;
        }

        .searchbox button {
            padding: 10px 20px;
        }

        .universities {
            width: 100%;
            height: auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px
        }

        .universities div {
            width: 300px;
            padding: 10px;
            height: auto;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <div class="searchbox">
        <input type="text">
        <button>search</button>
    </div>
    <div class="universities"></div>
    <script src="srcipt.js"></script>
</body>

</html>
